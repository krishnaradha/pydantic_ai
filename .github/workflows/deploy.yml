name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build & push api image
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/multi-agentic/api:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.registry }}/multi-agentic/api:latest -f Dockerfile .
          docker push ${{ steps.ecr.outputs.registry }}/multi-agentic/api:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/multi-agentic/api:latest

      - name: Build & push webapp image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }} \
            -t ${{ steps.ecr.outputs.registry }}/multi-agentic/webapp:${{ github.sha }} \
            -t ${{ steps.ecr.outputs.registry }}/multi-agentic/webapp:latest ./webapp
          docker push ${{ steps.ecr.outputs.registry }}/multi-agentic/webapp:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/multi-agentic/webapp:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          cat > /tmp/deploy.sh <<'DEPLOY_EOF'
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          mkdir -p /opt/app && cd /opt/app
          aws ssm get-parameters-by-path --path /multi-agentic --with-decryption --output json > /tmp/params.json
          python3 -c "import json; d = json.load(open('/tmp/params.json')); open('.env', 'w').write(chr(10).join(p['Name'].split('/')[-1] + '=' + p['Value'] for p in d['Parameters']))"
          echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d
          DEPLOY_EOF

          # Build the SSM parameters file via Python so the multi-line script
          # is safely JSON-encoded — avoids the AWS CLI shorthand "--parameters
          # commands=..." parser choking on embedded quotes.
          python3 -c "
          import json
          with open('/tmp/deploy.sh') as f:
              lines = f.read().splitlines()
          with open('/tmp/ssm_params.json', 'w') as f:
              json.dump({'commands': lines}, f)
          "

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy multi-agentic-system ${{ github.sha }}" \
            --parameters file:///tmp/ssm_params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
