# AWS deploy compose file — used on the EC2 instance only, driven by CI/CD.
#
# Differs from docker-compose.yml (local dev) in one way: api/webapp use
# prebuilt images pulled from ECR instead of `build:`. This box never runs
# `docker build` — GitHub Actions builds and pushes the images, this file
# just pulls and runs them. See docs/aws-setup-guide.md Part 2.
#
# Requires a .env in the same directory with (populated by the deploy step
# from SSM Parameter Store):
#   ECR_REGISTRY=<account-id>.dkr.ecr.<region>.amazonaws.com
#   IMAGE_TAG=<git sha>            # falls back to "latest" if unset
#   ...plus the app's normal secrets (OPENAI_API_KEY, CORS_ORIGINS, etc.)

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${ECR_REGISTRY}/multi-agentic/api:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000   # internal container port — 8001 is only for host access
    volumes:
      - traces_data:/app/data/traces
      - ./docs:/app/docs:ro
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 20s

  webapp:
    image: ${ECR_REGISTRY}/multi-agentic/webapp:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  chroma_data:
  traces_data:
  redis_data:
