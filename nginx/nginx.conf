upstream api_pool {
    # least_conn sends each new request to the replica with the fewest active connections.
    # Round-robin (default) is fine too — swap "least_conn" for "round_robin" if preferred.
    least_conn;

    # Docker Compose DNS resolves "api" to all replica IPs automatically.
    # To add more replicas: docker compose up --scale api=N
    server api:8000;
}

server {
    listen 80;

    # Forward all traffic to the api replica pool
    location / {
        proxy_pass         http://api_pool;
        proxy_http_version 1.1;

        # Required for SSE (streaming responses)
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Disable buffering so SSE token chunks reach the client immediately
        proxy_buffering    off;
        proxy_cache        off;

        # Long timeout for slow agent runs
        proxy_read_timeout 180s;
    }
}
